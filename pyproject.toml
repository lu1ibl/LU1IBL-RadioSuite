[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiosuite"
version = "0.1.0"
description = "LU1IBL RadioSuite"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    {name = "LU1IBL"}
]

dependencies = [
    "requests",
    "pandas",
    "openpyxl"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
